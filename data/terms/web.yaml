  category: web
  level: beginner
  tags:
    - web
  definition: >-
    A website served from prebuilt files instead of generating each page on demand.
  analogy: >-
    A prepared picnic: open the basket and everything is already there.
  example: >-
    GitHub Pages can host prebuilt HTML, CSS, and JavaScript.
  caveat: >-
    A static site can still have interactive client-side features.
  related:
    - ssr
    - github-pages
  sources:
    - title: MDN web documentation
      url: https://developer.mozilla.org/en-US/docs/Web
- id: ui-component
  term: UI component
  aliases:
    - user interface component
  category: web
  level: beginner
  tags:
    - web
    - react
  definition: >-
    A reusable piece of a user interface with a defined purpose, such as a button, date
    picker, or navigation menu.
  analogy: >-
    A LEGO brick with a job description and hopefully no surprise sharp edges.
  example: >-
    The same SearchBox component can appear on a dictionary homepage and a documentation
    page.
  caveat: >-
    A UI component need not use React. Keep its inputs, behavior, and accessibility clear
    instead of splitting everything into tiny pieces.
  related:
    - react-component
    - ui
    - accessibility
  sources:
    - title: UI component — reference and documentation
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Core/Frameworks_libraries/Introduction
- id: virtual-dom
  term: Virtual DOM
  aliases:
    - VDOM
  category: web
  level: intermediate
  tags:
    - web
    - react
  definition: >-
    An in-memory description of a UI used to help a renderer determine which changes to
    apply to the actual interface.
  analogy: >-
    A stage plan the crew compares before moving real furniture around.
  example: >-
    After state changes, React computes the next UI description and commits necessary
    changes to the browser DOM.
  caveat: >-
    It is not a second browser DOM or a guaranteed performance win. React rendering,
    reconciliation, and DOM commits are distinct steps.
  related:
    - virtual-dom-tree
    - dom
    - react
  sources:
    - title: Virtual DOM — reference and documentation
      url: https://legacy.reactjs.org/docs/faq-internals.html
- id: virtual-dom-tree
  term: Virtual DOM tree
  aliases:
    - virtual tree
    - virtual element tree
  category: web
  level: intermediate
  tags:
    - web
    - react
  definition: >-
    The hierarchical arrangement of a UI's in-memory element descriptions, reflecting how
    elements are nested.
  analogy: >-
    The seating chart for an imaginary theatre, before anyone moves the real chairs.
  example: >-
    A description of a section can contain a heading and a list whose children describe
    individual terms.
  caveat: >-
    The element tree, component tree, actual DOM tree, and React's internal Fiber
    structures are related but not identical.
  related:
    - virtual-dom
    - react-component
    - dom
  sources:
    - title: Virtual DOM tree — reference and documentation
      url: https://react.dev/learn/understanding-your-ui-as-a-tree
- id: web-application
  term: Web application
  aliases:
    - webapp
    - web app
    - web application
  category: web
  level: beginner
  tags:
    - web
  definition: >-
    Software accessed through web technologies that lets users perform tasks and interact
    with data.
  analogy: >-
    A website that gives you a desk and tools instead of only a brochure.
  example: >-
    An online issue tracker lets users create tickets, assign owners, and update status in
    a browser.
  caveat: >-
    A web application need not be a single-page application. It can use server-rendered
    pages, client rendering, or a combination.
  related:
    - website
    - single-page-application
    - frontend
    - backend
  sources:
    - title: "MDN: Express/Node introduction and web applications"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Server-side/Express_Nodejs/Introduction
- id: scraping
  term: Web scraping
  aliases:
    - scraping
    - web scraper
    - web data extraction
  category: web
  level: intermediate
  tags:
    - web
  definition: >-
    Programmatically extracting information from web pages, often by fetching and parsing
    their content.
  analogy: >-
    A very literal assistant copying the menu into a spreadsheet, including any typos the
    chef insists are intentional.
  example: >-
    A script downloads a permitted documentation page and extracts its headings using an
    HTML parser.
  caveat: >-
    Page structures change, and client-rendered content may need different handling.
    Respect access rules, usage terms, and rate limits; an available API is often more
    stable.
  related:
    - html
    - dom
    - api
  sources:
    - title: Web scraping — reference and documentation
      url: https://docs.scrapy.org/en/latest/intro/overview.html
- id: website
  term: Website
  aliases:
    - web site
  category: web
  level: beginner
  tags:
    - web
  definition: >-
    A collection of related web pages and resources presented under a shared site identity.
  analogy: >-
    A digital address with rooms for articles, products, and the inevitable contact form.
  example: >-
    A documentation website includes a homepage, guides, reference pages, and a search
    tool.
  caveat: >-
    A website can include interactive applications. Website and web application are
    overlapping descriptions, not strict technical opposites.
  related:
    - web-application
    - html
    - static-site
  sources:
    - title: "MDN: Browsing the web"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Environment_setup/Browsing_the_web
- id: websocket
  term: WebSocket
  aliases:
    - web sockets
  category: web
  level: intermediate
  tags:
    - web
  definition: >-
    A protocol for ongoing, two-way communication over a connection.
  analogy: >-
    A phone call between browser and server, instead of mailing a new letter every time.
  example: >-
    A chat app can receive new messages over a WebSocket.
  caveat: >-
    Connections can drop and may need reconnection logic.
  related:
    - http
    - tcp
  sources:
    - title: "MDN: WebSocket"
      url: https://developer.mozilla.org/en-US/docs/Web/API/WebSocket
- id: xml
  term: XML
  aliases:
    - Extensible Markup Language
  category: web
  level: beginner
  tags:
    - web
  definition: >-
    A text markup language for representing structured information with nested elements,
    attributes, and application-defined tags.
  analogy: >-
    A labeling machine so enthusiastic it labels both the opening and closing of every box.
  example: >-
    <term id="api"><name>API</name></term> represents a small structured record.
  caveat: >-
    XML is not HTML and does not prescribe one set of application tags. Parsing external
    XML requires attention to parser configuration and untrusted input.
  related:
    - html
    - json
    - dom
  sources:
    - title: XML — reference and documentation
      url: https://www.w3.org/XML/
- id: xmlhttprequest
  term: XMLHttpRequest
  aliases:
    - XHR
  category: web
  level: intermediate
  tags:
    - web
  definition: >-
    A browser API for making HTTP requests and receiving responses through events, widely
    used before Fetch became common.
  analogy: >-
    The veteran courier with a longer form to fill out and a perfectly usable delivery van.
  example: >-
    const xhr = new XMLHttpRequest(); xhr.open('GET', '/api/terms'); xhr.onload = () =>
    console.log(xhr.responseText); xhr.send();
  caveat: >-
    It can receive JSON and other formats, not only XML. Asynchronous XHR is still
    supported; avoid synchronous requests on the main thread.
  related:
    - fetch-api
    - ajax
    - http
  sources:
    - title: "MDN: XMLHttpRequest"
      url: https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest
