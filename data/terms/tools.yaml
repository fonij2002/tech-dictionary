    Bash can run commands and shell scripts.
  caveat: >-
    Quoting rules matter when passing data into commands.
  related:
    - cli
    - operating-system
  sources:
    - title: Bash manual
      url: https://www.gnu.org/software/bash/manual/bash.html
- id: software-factory
  term: Software factory
  aliases:
    - software factories
  category: tools
  level: intermediate
  tags:
    - tools
  definition: >-
    An organized set of reusable tools, templates, processes, and automation for producing
    and delivering software consistently.
  analogy: >-
    A workshop with repeatable build stations, rather than a wizard manually forging every
    release at midnight.
  example: >-
    A team supplies service templates, automated tests, security checks, and deployment
    pipelines for new applications.
  caveat: >-
    The term has several industry meanings and is not a specific product. It differs from
    the Factory Pattern, which concerns object creation in code.
  related:
    - pipeline
    - ci
    - cd
    - factory-pattern
  sources:
    - title: "Microsoft: Web Service Software Factory Modeling Edition"
      url: https://learn.microsoft.com/en-us/archive/msdn-magazine/2008/launch/service-station-web-service-software-factory-modeling-edition
- id: test-double
  term: Test double
  aliases:
    - test doubles
  category: tools
  level: intermediate
  tags:
    - tools
  definition: >-
    A substitute for a real collaborator used during testing, including dummies, stubs,
    spies, mocks, and fakes.
  analogy: >-
    A stunt double for your database who does not demand a production password.
  example: >-
    A fake in-memory repository replaces a database while testing application logic.
  caveat: >-
    Different doubles serve different goals. Passing with a substitute does not prove
    compatibility with the real dependency.
  related:
    - mock
    - unit-test
    - integration-test
  sources:
    - title: Test double — reference and documentation
      url: https://martinfowler.com/bliki/TestDouble.html
- id: test-suite
  term: Test suite
  aliases:
    - test suites
  category: tools
  level: beginner
  tags:
    - tools
  definition: >-
    A collection of tests organized to run together for a project, feature, or purpose.
  analogy: >-
    A choir of assertions; one off-key result can stop the performance.
  example: >-
    A search test suite covers normalization, matching, empty input, and filter
    combinations.
  caveat: >-
    A green suite only covers the behavior it actually checks. Test counts alone do not
    establish confidence or meaningful coverage.
  related:
    - unit-test
    - integration-test
    - assertion
  sources:
    - title: Test suite — reference and documentation
      url: https://jestjs.io/docs/api#describename-fn
- id: transpiler
  term: Transpiler
  aliases:
    - source-to-source compiler
    - transpilation
  category: tools
  level: intermediate
  tags:
    - tools
  definition: >-
    A compiler that translates source code into another source-language form, often at a
    similar abstraction level.
  analogy: >-
    Rewriting a recipe for a different kitchen without turning it into machine-code soup.
  example: >-
    A TypeScript compiler removes type syntax and emits JavaScript for execution.
  caveat: >-
    The compiler/transpiler boundary is informal. Transforming syntax does not
    automatically supply missing runtime features.
  related:
    - babel
    - compiler
    - javascript
  sources:
    - title: "MDN: Transpiler"
      url: https://developer.mozilla.org/en-US/docs/Glossary/Compile
    - title: "Babel: JavaScript source transformations"
      url: https://babeljs.io/docs/
- id: unit-test
  term: Unit test
  aliases:
    - unit testing
  category: tools
  level: beginner
  tags:
    - tools
  definition: >-
    A test focused on a small unit of behavior, with a narrow scope and controlled
    dependencies.
  analogy: >-
    Checking one toaster before blaming the entire breakfast buffet.
  example: >-
    Test that normalizeTerm('  React  ') returns 'react' without starting a browser or
    server.
  caveat: >-
    A unit is a useful testing boundary, not necessarily one method. Test behavior rather
    than private implementation details.
  related:
    - integration-test
    - test-double
    - assertion
  sources:
    - title: Unit test — reference and documentation
      url: https://martinfowler.com/bliki/UnitTest.html
