- id: assertion
  term: Assertion
  aliases:
    - test assertion
    - assert
  category: tools
  level: beginner
  tags:
    - tools
  definition: >-
    A check that states an expected condition and reports a failure when it is not met.
  analogy: >-
    The test's moment of truth: 'I expected tea; this appears to be a stapler.'
  example: >-
    expect(results).toHaveLength(3); asserts that a search returned three entries.
  caveat: >-
    An assertion checks one claim, not overall correctness. Choose checks that express
    behavior rather than freezing incidental implementation details.
  related:
    - jest
    - unit-test
    - test-suite
  sources:
    - title: Assertion — reference and documentation
      url: https://jestjs.io/docs/expect
- id: babel
  term: Babel
  aliases:
    - Babel.js
  category: tools
  level: intermediate
  tags:
    - tools
    - javascript
  definition: >-
    A JavaScript compiler toolchain that can transform newer syntax and JSX into
    JavaScript suitable for configured target environments.
  analogy: >-
    A translator helping modern JavaScript chat with browsers that missed a few language
    classes.
  example: >-
    A build uses @babel/preset-react to transform JSX and @babel/preset-env to target
    supported browsers.
  caveat: >-
    Babel does not always output ES5. Syntax transforms and missing runtime APIs are
    different problems; APIs may need polyfills.
  related:
    - transpiler
    - babel-preset
    - jsx
    - es6
  sources:
    - title: Babel — reference and documentation
      url: https://babeljs.io/docs/
- id: babel-preset
  term: Babel preset
  aliases:
    - Babel presets
  category: tools
  level: intermediate
  tags:
    - tools
    - javascript
  definition: >-
    A reusable bundle of Babel plugins and configuration for a particular transformation
    goal.
  analogy: >-
    A combo meal of compiler settings, hopefully without an unwanted side of legacy
    browser support.
  example: >-
    @babel/preset-react configures JSX-related transforms; @babel/preset-env selects
    transforms based on targets.
  caveat: >-
    A preset is configuration, not the Babel runtime. Its options and installed plugins
    determine what code is transformed.
  related:
    - babel
    - transpiler
    - jsx
  sources:
    - title: Babel preset — reference and documentation
      url: https://babeljs.io/docs/presets
- id: behavior-driven-style
  term: Behavior-driven style
  aliases:
    - BDD style
    - behavior-driven testing
    - behavior-driven development
    - BDD
  category: tools
  level: intermediate
  tags:
    - tools
  definition: >-
    An approach to describing software behavior through concrete scenarios and expected
    outcomes, often written as Given, When, Then.
  analogy: >-
    A rehearsal script saying what the audience should see, rather than listing every
    screw in the stage.
  example: >-
    Given no search matches, when the user searches, then an informative empty state
    appears.
  caveat: >-
    Naming tests describe and it is only a style. Full BDD includes collaborative
    discovery of behavior, not merely a particular test syntax.
  related:
    - test-suite
    - assertion
    - integration-test
  sources:
    - title: Behavior-driven style — reference and documentation
      url: https://cucumber.io/docs/bdd/
