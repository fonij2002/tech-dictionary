- id: factory-pattern
  term: Factory Pattern
  aliases:
    - factory function
    - object factory
    - factory method
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A creational design approach that puts object creation behind a function or
    abstraction so callers need not choose or construct concrete implementations directly.
  analogy: >-
    Order a drink at the counter without personally assembling the espresso machine.
  example: >-
    createStorage('memory') returns an in-memory store, while createStorage('disk')
    returns a disk-backed store with the same interface.
  caveat: >-
    A simple factory function, the formal Factory Method pattern, and Abstract Factory are
    related but distinct. Do not add factories without useful variation.
  related:
    - design-pattern
    - constructor
    - interface
  sources:
    - title: "Microsoft Learn: Simple Factory, Factory Method, and Abstract Factory"
      url: https://learn.microsoft.com/en-us/shows/visual-studio-toolbox/design-patterns-factories
- id: function
  term: Function
  aliases:
    - JavaScript function
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    A callable piece of code that can receive inputs, perform work, and return a value.
  analogy: >-
    A tiny recipe you can reuse without rewriting the cookbook each time.
  example: >-
    function double(n) { return n * 2; } returns 6 when called with double(3).
  caveat: >-
    Functions need not be pure or return an explicit value. In JavaScript, falling through
    without returning produces undefined.
  related:
    - function-parameter
    - function-argument
    - method
    - callback
  sources:
    - title: "MDN: Function"
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Functions
