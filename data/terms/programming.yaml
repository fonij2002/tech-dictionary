- id: callback
  term: Callback function
  aliases:
    - callback
    - callbacks
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    A function supplied to other code so that code can invoke it when appropriate.
  analogy: >-
    Leaving your phone number with the restaurant; sometimes they call later, sometimes
    immediately.
  example: >-
    [1, 2, 3].map(n => n * 2) calls the supplied callback for each array element.
  caveat: >-
    Callbacks can be synchronous or asynchronous. Passing a function is different from
    immediately calling it and passing its result.
