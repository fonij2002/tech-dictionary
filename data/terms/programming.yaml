- id: uuid
  term: UUID
  aliases:
    - Universally Unique Identifier
    - GUID
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A standardized 128-bit identifier format designed to make independently generated
    identifiers very unlikely to collide.
  analogy: >-
    A name tag long enough that two strangers probably will not accidentally become the
    same database row.
  example: >-
    crypto.randomUUID() generates a random version 4 UUID in supported secure browser
    contexts.
  caveat: >-
    Uniqueness is probabilistic for random UUIDs. A UUID is not automatically a secret, an
    authorization check, or a chronologically sortable value.
  related:
    - primary-key
    - object
    - database
