- id: variable-initialization
  term: Variable initialization
  aliases:
    - initialization
    - variable initialisation
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    Giving a variable its initial value when its binding becomes initialized.
  analogy: >-
    The first snack in the locker, before the snack rotation begins.
  example: >-
    let score = 0; initializes score with 0; let name; initializes name with undefined.
  caveat: >-
    Initialization is the first value, not every later assignment. A lexical binding
    cannot be read before initialization.
  related:
