- id: const
  term: const
  aliases:
    - const declaration
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    A JavaScript declaration for a block-scoped binding that cannot be reassigned after
    initialization.
  analogy: >-
    A permanent name tag on a box, not a promise that nobody can rearrange its contents.
  example: >-
    const user = { name: 'Ada' }; user.name = 'Grace'; is allowed, but user = {}; is not.
  caveat: >-
    const does not make objects or arrays immutable. A const declaration needs an
    initializer and has a temporal dead zone.
  related:
    - let
    - immutable
    - variable-assignment
  sources:
    - title: "MDN: const"
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/const
- id: constructor
  term: Constructor
  aliases:
