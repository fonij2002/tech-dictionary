- id: array
  term: Array
  aliases:
    - JavaScript array
    - arrays
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    An ordered JavaScript collection whose elements can be accessed with zero-based
    indexes.
  analogy: >-
    A row of numbered lockers where the first locker insists its number is zero.
  example: >-
    const terms = ['API', 'React']; terms[0] returns 'API'.
  caveat: >-
    JavaScript arrays can mix value types and change length. They are objects, and many
    methods mutate them in place.
