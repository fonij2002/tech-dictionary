  definition: >-
    Introducing a variable name into a scope using a declaration such as let, const, or
    var.
  analogy: >-
    Putting a name tag on a locker before deciding what goes inside.
  example: >-
    let score; declares a block-scoped variable named score.
  caveat: >-
