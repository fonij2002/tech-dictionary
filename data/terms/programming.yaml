- id: reducer
  term: Reducer
  aliases:
    - state reducer
    - Redux reducer
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A function that calculates an accumulated or next value from the current value and an
    input; state reducers commonly use the previous state and an action.
  analogy: >-
    A scorekeeper who reads one event and writes the next score without secretly ordering
    pizza.
  example: >-
    function reducer(state, action) { return action.type === 'increment' ? state + 1 :
    state; }
  caveat: >-
    React and Redux reducers should be pure and avoid side effects or direct mutation of
    existing state. Redux Toolkit's draft syntax is a special abstraction.
  related:
    - redux
