- id: decoupling
  term: Decoupling
  aliases:
    - loose coupling
    - separation of concerns
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    Reducing unnecessary dependencies so parts can change, be tested, or be replaced with
    less impact on each other.
  analogy: >-
    Giving the toaster and fridge their own cables before somebody asks for a kitchen
    redesign.
  example: >-
    Pass a repository interface to application logic instead of importing a specific
    database client everywhere.
  caveat: >-
    An extra interface does not automatically remove behavioral dependencies.
    Over-abstraction can add complexity without useful independence.
  related:
    - coupling
    - interface
    - test-double
  sources:
    - title: Decoupling — reference and documentation
      url: https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/architectural-principles
- id: design-pattern
  term: Design pattern
  aliases:
    - software design pattern
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A named, reusable approach to a recurring design problem, adapted to a particular
    context rather than pasted as finished code.
  analogy: >-
    A tried-and-tested seating plan, not a command to host every dinner in exactly the
    same room.
  example: >-
    The Factory Pattern centralizes object creation when the concrete type depends on
    input.
  caveat: >-
    A pattern is useful only when it fits the problem. Adding named patterns unnecessarily
    can make simple code harder to follow.
  related:
    - factory-pattern
    - mvc
    - refactoring
  sources:
    - title: Design pattern — reference and documentation
      url: https://www.martinfowler.com/articles/writingPatterns.html
