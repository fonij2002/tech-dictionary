- id: async-function
  term: async function
  aliases:
    - async
    - async keyword
    - async/await
    - await
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A JavaScript function declared with async that always returns a promise and can use
    await to pause its own execution for a result.
  analogy: >-
    A waiter who can leave your table while an order is pending without closing the
    restaurant.
  example: >-
    async function load() { const r = await fetch('/api/terms'); return r.json(); }
    returns a promise.
  caveat: >-
    await pauses that function, not the entire runtime. async does not move CPU-heavy code
    to another thread; top-level await is supported in modules.
  related:
    - async
    - promise
    - fetch-api
  sources:
    - title: "MDN: async function"
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/async_function
- id: async
  term: Asynchronous
  aliases:
    - asynchrony
    - asynchronous operation
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    Describes work whose result can arrive later without requiring the caller to block
    until it completes.
  analogy: >-
    Order coffee, do another task, and return when your name is shouted with creative
    spelling.
  example: >-
    A browser can handle user input while an asynchronous network request is pending.
  caveat: >-
    Asynchronous does not automatically mean parallel or run on a new thread. Long
    synchronous JavaScript can still block the UI.
  related:
    - async-function
    - promise
    - callback
    - io
  sources:
    - title: "MDN: Asynchronous"
      url: https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Async_JS/Introducing
