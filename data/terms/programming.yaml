- id: single-responsibility-principle
  term: Single Responsibility Principle
  aliases:
    - SRP
    - single responsibility
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    A design principle that groups code around one responsibility, so it has one coherent
    reason to change.
  analogy: >-
    Do not make the chef also handle payroll just because both tasks involve dough.
  example: >-
    Separate invoice calculation from PDF formatting because pricing rules and document
    layouts change for different reasons.
  caveat: >-
    One responsibility does not mean one line, one method, or one HTML element. Choose
    boundaries based on related reasons for change.
  related:
    - react-component
    - coupling
    - refactoring
