- id: coupling
  term: Coupling
  aliases:
    - tight coupling
    - loose coupling
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    The degree to which parts of a system depend on each other's details, behavior, or
    structure.
  analogy: >-
    Two appliances sharing a power cable so enthusiastically that moving the toaster
    relocates the fridge.
  example: >-
    A component that knows a database's table layout is coupled to that storage
    implementation.
  caveat: >-
    Some coupling is unavoidable and useful. Reduce dependencies on unstable details
    rather than aiming for a system where nothing knows anything.
  related:
    - decoupling
    - interface
    - single-responsibility-principle
  sources:
    - title: Coupling — reference and documentation
      url: https://learn.microsoft.com/en-us/dotnet/architecture/modern-web-apps-azure/architectural-principles
