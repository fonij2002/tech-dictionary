- id: var
  term: var
  aliases:
    - var declaration
  category: programming
  level: beginner
  tags:
    - programming
    - javascript
  definition: >-
    A JavaScript declaration that creates a function-scoped or global-scoped variable
    rather than a block-scoped one.
  analogy: >-
    The office worker who ignores cubicle walls and treats the whole floor as one desk.
  example: >-
    function demo() { if (true) { var x = 1; } return x; } returns 1.
  caveat: >-
    var bindings are initialized to undefined before their declaration executes, and
    redeclaration is allowed. Prefer let or const when block scope is intended.
  related:
    - let
    - const
    - hoisting
  sources:
    - title: "MDN: var"
      url: https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Statements/var
