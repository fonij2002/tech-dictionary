  aliases:
    - wrapper function
    - wrapper component
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    Code that surrounds another function, component, or API to adapt it or add behavior.
  analogy: >-
    A lunchbox around an existing sandwich, adding convenience without inventing new bread.
  example: >-
