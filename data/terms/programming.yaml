- id: hoisting
  term: Hoisting
  aliases: []
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    The name for declaration behaviors that can make bindings affect a scope before
    execution reaches their written declaration.
  analogy: >-
    The guest list reaches the party before some guests receive permission to enter.
  example: >-
    sayHi(); function sayHi() { return 'Hi'; } works because the function declaration is
    initialized early.
  caveat: >-
    Source code is not literally moved. var is initialized to undefined early; let, const,
    and classes cannot be used before initialization.
  related:
    - var
    - let
    - const
    - variable-initialization
  sources:
    - title: "MDN: Hoisting"
      url: https://developer.mozilla.org/en-US/docs/Glossary/Hoisting
- id: immutable
