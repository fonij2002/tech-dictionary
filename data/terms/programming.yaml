- id: chaining
  term: Chaining
  aliases:
    - chain
    - method chaining
    - promise chain
    - promise chaining
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    Connecting operations so a returned value or promise becomes the starting point for
    the next operation.
  analogy: >-
    A relay race where the baton is data, and forgetting to return it ruins everyone's
    afternoon.
  example: >-
    fetch('/api/terms').then(r => r.json()).then(terms => terms.length) chains
    promise-based steps.
  caveat: >-
    Return a needed value or promise from each .then handler. Chaining synchronous methods
    does not make them asynchronous.
  related:
    - promise
    - method
    - pipeline
  sources:
