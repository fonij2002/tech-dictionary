    - javascript
  definition: >-
    A function or class method used to initialize an object when an instance is created.
  analogy: >-
    The move-in checklist that gives a new object its keys, furniture, and unreasonable
    defaults.
  example: >-
    class User { constructor(name) { this.name = name; } } initializes new User('Ada').
  caveat: >-
    React function components have no constructor method. Class constructors and ordinary
    function calls have different rules.
  related:
