  aliases:
    - immutability
    - immutable data
  category: programming
  level: intermediate
  tags:
    - programming
    - javascript
  definition: >-
    Unable to change after creation, or deliberately treated as unchangeable so updates
    produce new values instead.
  analogy: >-
    A printed menu: publish a new edition instead of scribbling over everyone's copy.
  example: >-
    const next = [...items, 'new']; creates a new array rather than pushing into items.
  caveat: >-
    JavaScript objects are mutable by default. const protects the binding, and
    Object.freeze is shallow unless nested values are handled too.
  related:
    - mutation
    - const
    - pure-function
  sources:
    - title: "MDN: Immutable"
      url: https://developer.mozilla.org/en-US/docs/Glossary/Immutable
